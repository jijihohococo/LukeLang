name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3 libsqlite3-dev libsodium-dev libpq-dev \
            postgresql postgresql-client curl ca-certificates gdb

      - name: Start Postgres
        run: |
          set -euo pipefail
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER luke WITH PASSWORD 'luke' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE luke OWNER luke;" || true
          pg_isready -h 127.0.0.1 -p 5432
          PGPASSWORD=luke psql -h 127.0.0.1 -U luke -d luke -c 'SELECT 1'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install WASI SDK
        run: |
          set -euo pipefail
          VER=22.0
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-22/wasi-sdk-${VER}-linux.tar.gz" \
            -o /tmp/wasi-sdk.tgz
          mkdir -p .tools
          tar -xzf /tmp/wasi-sdk.tgz -C /tmp
          mv "/tmp/wasi-sdk-${VER}" .tools/wasi-sdk
          test -x .tools/wasi-sdk/bin/clang
          echo "LUKE_WASI_SDK=$PWD/.tools/wasi-sdk" >> "$GITHUB_ENV"

      - name: Build + test (Play, Build, Frontend, Reactive)
        working-directory: vm
        run: make test
        env:
          LUKE_WASI_SDK: ${{ github.workspace }}/.tools/wasi-sdk

  syntax-v2-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Spec covers every live conversational phrase
        run: python3 scripts/syntax_v2_spec_check.py

      - name: Golden corpus paired with v1 twins, no v1 leakage
        run: python3 scripts/syntax_v2_corpus_check.py

      - name: Install build deps for the v2 equivalence harness
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3 libsqlite3-dev libsodium-dev libpq-dev

      - name: Build toolchain
        run: make -C vm -j2

      - name: v2 golden corpus is equivalent to its v1 twins
        run: bash scripts/syntax_v2_equiv.sh

  site-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install generator deps
        run: pip install --quiet markdown

      - name: Hosted docs match the Markdown they are generated from
        run: |
          python3 scripts/build_site_docs.py
          if ! git diff --quiet -- site/docs; then
            echo "site/docs is stale — run: python3 scripts/build_site_docs.py" >&2
            git --no-pager diff --stat -- site/docs
            exit 1
          fi

  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package official VS Code extension (.vsix)
        run: bash scripts/vscode_extension_package.sh

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LukeLang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f3faf6;
      --muted: #a7c4b4;
      --line: rgba(243, 250, 246, 0.14);
      --accent: #6fd3a0;
      --bg0: #08110e;
      --bg1: #143226;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      font-family: "Source Serif 4", Georgia, serif;
      background:
        radial-gradient(900px 520px at 12% -10%, #1c4a36 0%, transparent 60%),
        radial-gradient(700px 480px at 100% 0%, #0f2a22 0%, transparent 50%),
        linear-gradient(165deg, var(--bg1), var(--bg0) 55%);
    }
    .hero {
      min-height: 100vh;
      display: grid;
      align-content: center;
      padding: clamp(2rem, 6vw, 5rem);
      gap: 1.1rem;
      max-width: 52rem;
    }
    .brand {
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: clamp(3.4rem, 11vw, 6.4rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
      margin: 0;
      animation: rise 700ms ease-out both;
    }
    h1 {
      font-family: Syne, sans-serif;
      font-weight: 600;
      font-size: clamp(1.35rem, 3.2vw, 2rem);
      margin: 0;
      max-width: 18ch;
      animation: rise 800ms 80ms ease-out both;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.12rem;
      max-width: 36rem;
      animation: rise 900ms 140ms ease-out both;
    }
    .cta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 0.6rem;
      animation: rise 950ms 200ms ease-out both;
    }
    .cta a {
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 0.7rem 1.05rem;
      font-family: Syne, sans-serif;
      font-size: 0.95rem;
      transition: border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }
    .cta a.primary {
      background: var(--accent);
      color: #062015;
      border-color: transparent;
    }
    .cta a:hover { transform: translateY(-1px); border-color: var(--accent); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="hero">
    <p class="brand">LukeLang</p>
    <h1>Change finds its own way from row to pixel.</h1>
    <p>
      A native, reactive language. Live Graph watches the database; the compiler owns the rest.
      No fetch glue. No cache invalidation ritual.
    </p>
    <div class="cta">
      <a class="primary" href="../README.md">Get started</a>
      <a href="../docs/LIVE_GRAPH.md">Live Graph</a>
      <a href="../docs/DEPLOY.md">Deploy</a>
      <a href="../examples/deploy/wall/">Wall app</a>
    </div>
  </main>
</body>
</html>
